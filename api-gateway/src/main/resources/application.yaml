server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: false
          routes:
            - id: member-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/members/**
            - id: review-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/reviews/**
